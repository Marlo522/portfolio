<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/profile/profile-lightmode.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem('portfolio-theme'); } catch {}
        const theme = saved === 'light' || saved === 'dark' ? saved : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#111111' : '#ffffff');
      })();
    </script>
    <title>Marlo S. Veluz Jr. | Web & Mobile Portfolio</title>
    <meta name="description" content="Marlo S. Veluz Jr., Information Technology student at FEU Institute of Technology. Explore my web and mobile projects, skills, and certificates." />
    <meta name="author" content="Marlo S. Veluz Jr." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Marlo S. Veluz Jr. | Web & Mobile Portfolio" />
    <meta property="og:description" content="Web and mobile projects, one build at a time." />
    <meta name="twitter:card" content="summary" />
  </head>

</html>
